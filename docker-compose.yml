version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-ukp-kickball-secret-key-change-in-production}
      - FLASK_DEBUG=false

  scheduler:
    build: .
    command: python scheduler.py
    volumes:
      - ./data:/app/data
    restart: unless-stopped
